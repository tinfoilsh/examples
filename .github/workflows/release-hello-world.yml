# Tinfoil Containers — hello-world release workflow.
#
# Trigger from a branch via "Run workflow" and provide the version. Builds the
# container image, pushes it to GHCR with version + digest tags, creates the
# release tag, and publishes a GitHub release with the image digest in the notes.
#
# This repo is an image producer — it does not ship its own enclave config.
# To deploy the published image inside an enclave, use tinfoil-containers-template.

name: Release Hello World

run-name: Release hello-world ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v1.0.0)"
        required: true
        type: string

concurrency:
  group: tinfoil-containers-hello-world-release-${{ inputs.version }}

env:
  EXAMPLE_DIRECTORY: tinfoil-containers-hello-world
  IMAGE_NAME: ghcr.io/${{ github.repository }}/hello-world
  RELEASE_TAG: hello-world/${{ inputs.version }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout + check the tag does not exist
      packages: write # push the container image
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Check if version tag already exists
        run: |
          if git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | grep -q .; then
            echo "::error::Tag $RELEASE_TAG already exists"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=sha,format=short

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          context: ${{ env.EXAMPLE_DIRECTORY }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the git tag + GitHub release

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Create release tag
        run: |
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ needs.build.outputs.digest }}
          IMAGE: ${{ env.IMAGE_NAME }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "hello-world $VERSION" \
            --verify-tag \
            --generate-notes \
            --notes "Image: \`$IMAGE@$DIGEST\`"
